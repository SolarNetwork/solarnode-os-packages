# Postgres sizing for a small device (about 1 GB RAM, eMMC), shared by the SolarNode
# settings and history. Installed as
# /etc/postgresql/17/main/conf.d/zz-solarnode-historian-sizing.conf if missing; the
# name sorts after solarnode.conf, so these values override it.

shared_buffers = 128MB
effective_cache_size = 384MB
maintenance_work_mem = 32MB
autovacuum_work_mem = 32MB
autovacuum_max_workers = 2
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
temp_file_limit = 512MB
