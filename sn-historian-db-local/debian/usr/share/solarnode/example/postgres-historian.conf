# Postgres settings for the SolarNode historian (pg_cron and parallel workers).
# Installed as /etc/postgresql/17/main/conf.d/solarnode-historian.conf if missing.

max_worker_processes = 16
cron.use_background_workers = on
cron.log_run = on
cron.log_statement = off
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1
