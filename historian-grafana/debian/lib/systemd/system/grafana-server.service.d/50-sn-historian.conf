# Grafana settings for the SolarNode historian. To change one, set it in
# /etc/default/sn-historian-grafana, which overrides these: for example
# GF_SERVER_HTTP_ADDR=0.0.0.0 to listen on every address (see the sn-historian-grafana README).
[Service]
# Create the token, secret and admin password files, if missing (as root)
ExecStartPre=+/usr/share/sn-historian-grafana/bin/grafana-files.sh
# Listen on loopback only. Reach the UI with: ssh -L3333:localhost:3000 solar@<node>
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
# The admin password, generated on the first start (used when grafana.db is created).
Environment=GF_SECURITY_ADMIN_PASSWORD=$__file{/etc/sn-historian-grafana/admin-password}
# Don't contact grafana.com: no usage stats, update checks, news, feedback links, plugin
# downloads or signing key fetches.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_PLUGINS_PREINSTALL_DISABLED=true
Environment=GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED=true
# Plugins come from packages only, not the UI.
Environment=GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
# No publishing to the external snapshot service.
Environment=GF_SNAPSHOTS_EXTERNAL_ENABLED=false
# Log to the journal only, not also to /var/log/grafana.
Environment=GF_LOG_MODE=console
EnvironmentFile=-/etc/default/sn-historian-grafana
