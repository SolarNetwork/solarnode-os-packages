# The SolarNode datum history, through the node's SolarQuery API. The token and secret are
# those of a SolarNode security token: see the sn-historian-grafana README.
#
# - host: requests are signed for this host and port, so keep http:// and the port.
# - proxy: must be set, as without it requests go to query.solarnetwork.net. '' means no proxy.
#   The unfiltered data source sends its requests to /unfiltered, which the node strips before
#   it checks the signature.
# - mqtt: '' as streaming only works with SolarFlux, not a node.
apiVersion: 1
datasources:
  - name: SolarNode (filtered)
    uid: solarnode-filtered
    type: solarnetwork-solarnetwork-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: http://127.0.0.1:8080
      proxy: ''
      mqtt: ''
      token: '$__file{/etc/sn-historian-grafana/token}'
    secureJsonData:
      secret: '$__file{/etc/sn-historian-grafana/secret}'

  - name: SolarNode (unfiltered)
    uid: solarnode-unfiltered
    type: solarnetwork-solarnetwork-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      host: http://127.0.0.1:8080
      proxy: http://127.0.0.1:8080/unfiltered
      mqtt: ''
      token: '$__file{/etc/sn-historian-grafana/token}'
    secureJsonData:
      secret: '$__file{/etc/sn-historian-grafana/secret}'
